version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agent_governance}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  opa:
    image: openpolicyagent/opa:latest
    restart: unless-stopped
    command: ["run", "--server", "--addr=:8181", "/policies"]
    volumes:
      - ./policies:/policies
    ports:
      - "8181:8181"

  gateway:
    build: ./services/gateway
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
      - opa
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      - OPA_URL=http://opa:8181
    env_file: .env
    ports:
      - "8080:8080"

  control-plane:
    build: ./services/control-plane
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      - POSTGRES_HOST=postgres
    env_file: .env
    ports:
      - "8081:8081"

  agent-runner:
    build: ./services/agent-runner
    restart: unless-stopped
    depends_on:
      - gateway
    environment:
      - GATEWAY_BASE_URL=http://gateway:8080
    env_file: .env
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - control-plane
      - gateway
    env_file: .env
    ports:
      - "3000:3000"

volumes:
  pgdata:
